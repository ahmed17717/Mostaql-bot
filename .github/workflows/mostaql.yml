name: Mostaql to Telegram

on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub may delay runs; 5 min is the minimum
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mostaql
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
      - name: Save state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add seen.json
          git diff --staged --quiet || (git commit -m "update seen projects" && git push)
