name: Mostaql to Telegram

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: mostaql
  cancel-in-progress: false

jobs:
  run:
    runs-on: self-hosted      # runs on YOUR PC, not GitHub's servers
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false        # keeps seen.json between runs on your PC
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
